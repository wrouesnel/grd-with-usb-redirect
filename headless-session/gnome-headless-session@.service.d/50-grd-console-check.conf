# From grd-headless-session: GDM allows a user only one graphical session, so
# don't start a headless one for a user on the console. The session is skipped,
# with the reason in the journal, rather than restarted until systemd gives up.
[Service]
ExecCondition=/usr/libexec/grd-with-usb-redirect/grd-headless-check %i
